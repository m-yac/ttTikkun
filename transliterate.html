<!DOCTYPE html><html>
<head><meta charset="utf-8"><meta name="viewport">
<title>ttTikkun Transliteration</title>
<link rel="stylesheet" href="/src/style/common.css">
<link rel="stylesheet" href="/src/style/transliterate.css">
</head>
<body>
<div class="bodyContainer">

<div class="titleAndExplainer">
  <h1><a href="transliterate">Interactive Hebrew Transliteration</a></h1>
  <div class="explainer">
    <p>Enter Hebrew text on the left, ideally with <a class="alt" href="https://en.wikipedia.org/wiki/Hebrew_cantillation">accents (AKA trope or cantillation marks)</a> and its transliteration will show up on the right! <span id="hoverOrTap"><span class="hover">Hover</span><span class="tap">Tap</span></span> to highlight corresponding syllables/words.</p>
  </div>
</div>

<div class="options">
  <div id="alwaysOptionsPanel" class="optionsPanel"></div>
  <div id="optionsPanel" class="optionsPanel" hidden></div>
  <button id="optionsToggle" class="optionsToggle" type="button"
          aria-expanded="false" aria-controls="optionsPanel">Show more transliteration options</button>
</div>

<div class="heAndTl">
  <div id="he" class="heOrTl" contenteditable="plaintext-only"
       spellcheck="false" autocorrect="off" autocapitalize="off" translate="no"
       dir="rtl"></div>
  <div id="tl" class="heOrTl"></div>
</div>

</div>
<script type="module" src="/src/transliterate.ts"></script>
</body>
</html>
